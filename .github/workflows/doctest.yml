name: "Doctests"
on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - '**.py'
        - '**.rst'

jobs:
  doctest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      
      - name: sphinx
        run:  uv run --group docs sphinx-build -M doctest  "docs/source" "docs/build"

    