name: Ruff
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'ruff.toml'
      - "pyproject.toml"

jobs:
  type-format-checking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
    
      - name: ruff format
        run: uv run --group lint ruff format --check .

      - name: ruff check
        run: uv run --group lint ruff check .
  
    
